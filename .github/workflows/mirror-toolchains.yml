name: Mirror static toolchains to GitHub Release

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      # No checkout: the cache release is a draft, so there is no git tag to create.
      - name: Ensure Single Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_REPO="${{ github.repository }}"
          TAG_NAME="toolchain-cache"

          # Kept as a DRAFT so the toolchain cache never shows up on the Releases
          # page and never creates a git tag. Drafts (and their assets) are only
          # reachable through the authenticated API, which is exactly how
          # kernel-source-sync and the cache actions already fetch them.
          if gh release view "$TAG_NAME" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG_NAME" --repo "$TARGET_REPO" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Draft release '$TAG_NAME' already exists."
            else
              echo "Release '$TAG_NAME' is published - converting it to a draft..."
              gh release edit "$TAG_NAME" --draft=true --repo "$TARGET_REPO"
              echo "::notice::'$TAG_NAME' is now a draft and off the Releases page. Its old git tag still exists; drop it with: git push origin :refs/tags/$TAG_NAME"
            fi
          else
            echo "Release not found. Creating draft..."
            gh release create "$TAG_NAME" \
              --draft \
              --title "Toolchains Mirror Cache" \
              --notes "Deduplicated Toolchains for Kernel Build" \
              --repo "$TARGET_REPO"
          fi

  generate-mirror-matrix:
    runs-on: ubuntu-24.04
    needs: prepare-release
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve Unique Projects
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # Shared with clean-up.yml so "which toolchains do we need?" has exactly
          # one definition: this job uploads that set, the pruner keeps it. When the
          # two drifted, an age-based prune could delete assets this job still
          # considers required.
          python3 .github/scripts/resolve_toolchain_assets.py \
            --configs-dir configs \
            --manifests-dir manifests \
            --format json \
            --output toolchains.json

          matrix="$(jq -c '.matrix' toolchains.json)"
          count="$(jq -r '.count' toolchains.json)"
          failed="$(jq -r '.failed' toolchains.json)"

          {
            echo "matrix=$matrix"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

          echo "Unique toolchains to mirror: $count (configs that failed to resolve: $failed)"

          if [ "$failed" -gt 0 ]; then
            jq -r '.failures[] | "::warning::\(.model): \(.error)"' toolchains.json
          fi

          if [ "$count" -eq 0 ]; then
            echo "::warning::No toolchain projects found. Mirror job will be skipped."
          fi

  mirror-to-release:
    name: mirror (${{ matrix.type_label }}, ${{ matrix.rev }})
    needs:
      - prepare-release
      - generate-mirror-matrix
    if: ${{ needs.generate-mirror-matrix.outputs.count != '0' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-mirror-matrix.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install download tools
        shell: bash
        run: |
          set -euo pipefail

          # Hosted runners intermittently ship a broken Microsoft/azure-cli apt repo
          # (packages.microsoft.com "no longer signed"), which makes apt-get update
          # exit non-zero. Drop those third-party lists so update only hits the valid
          # Ubuntu repos, and don't let a partial update fail the step.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends aria2 pigz
          sudo apt-get clean

      - name: Sync and Upload Toolchain
        shell: bash
        run: |
          set -euo pipefail

          TARGET_REPO="${{ github.repository }}"
          FILENAME="${{ matrix.cache_file }}"
          DOWNLOAD_URL="${{ matrix.url }}"
          REV="${{ matrix.rev }}"
          RELEASE_TAG="toolchain-cache"

          # A sha-keyed asset can never change, so a hit means we are done. A
          # branch-keyed one (AnyKernel3 tracks a branch, not a sha) keeps its
          # filename while its contents move, so skipping on a name hit would
          # freeze it at whatever was mirrored first -- re-fetch and clobber.
          if [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            IMMUTABLE=true
          else
            IMMUTABLE=false
            echo "ℹ️  '$REV' is not a commit sha: re-mirroring $FILENAME instead of trusting the cached copy."
          fi

          echo "🔍 Checking if $FILENAME exists in mirror..."

          # Private repo + draft release: github.com/<repo>/releases/download/<tag>
          # 404s and the tag is not resolvable anonymously, so query the asset list
          # via the authenticated gh CLI (which finds drafts by tag_name) instead.
          CACHED_ASSETS="$(gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)"

          if grep -qxF "$FILENAME" <<<"$CACHED_ASSETS" || grep -qxF "${FILENAME}.partaa" <<<"$CACHED_ASSETS"; then
            CACHED=true
          else
            CACHED=false
          fi

          if [ "$IMMUTABLE" = true ] && [ "$CACHED" = true ]; then
            echo "✅ ${{ matrix.type_label }} revision ${{ matrix.rev }} already cached."
            exit 0
          fi

          echo "📥 Downloading ${{ matrix.type_label }} from source..."
          echo "URL: $DOWNLOAD_URL"

          DL_OK=true
          aria2c \
            -x16 \
            -s16 \
            -k1M \
            -j5 \
            --file-allocation=none \
            --console-log-level=warn \
            --summary-interval=10 \
            --retry-wait=5 \
            --max-tries=10 \
            --allow-overwrite=true \
            -o "$FILENAME" \
            "$DOWNLOAD_URL" || DL_OK=false

          if [ "$DL_OK" != true ] || [ ! -s "$FILENAME" ]; then
            if [ "$CACHED" = true ]; then
              echo "::warning::Could not re-fetch $FILENAME; keeping the copy already in the mirror."
              exit 0
            fi
            echo "::error::Failed to download $FILENAME from $DOWNLOAD_URL"
            exit 1
          fi

          FILE_SIZE="$(stat -c%s "$FILENAME")"
          echo "Downloaded size: $FILE_SIZE bytes"

          MAX_SIZE=2000000000

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "⚠️ File > 2GB. Splitting..."
            split -b 1500M -a 2 "$FILENAME" "${FILENAME}.part"

            for part in "${FILENAME}".part*; do
              echo "📤 Uploading $part..."
              gh release upload "$RELEASE_TAG" "$part" --clobber --repo "$TARGET_REPO"
            done
          else
            echo "📤 Uploading single file..."
            gh release upload "$RELEASE_TAG" "$FILENAME" --clobber --repo "$TARGET_REPO"
          fi

          echo "✅ Upload complete."
# ci: register on default branch
