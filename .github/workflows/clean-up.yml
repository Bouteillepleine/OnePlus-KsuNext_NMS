name: 🧹 Cleanup Caches and Workflow Runs

# WHAT THIS REPO ACTUALLY CACHES
#
#   ccache      -> assets on the DRAFT release tagged `ccache-cache`
#   toolchains  -> assets on the DRAFT release tagged `toolchain-cache`
#
# `actions/cache` is used NOWHERE in this repo, so repos/<r>/actions/caches is
# permanently empty. The pre-rewrite version of this workflow enumerated exactly
# that endpoint, so it reported "0.00 GB / 🟢 Healthy" and deleted nothing, ever,
# while the two release buckets grew past 100 GB.
#
# A draft release has NO git tag, so repos/<r>/releases/tags/<tag> returns 404
# for both buckets even though `gh release view <tag>` finds them. Every lookup
# below LISTS releases and matches `.tag_name`, exactly like
# .github/actions/cache/{restore,save} already do. Listing drafts requires push
# access, which is why read-only jobs still take `contents: write`.

on:
  workflow_dispatch:
    inputs:
      cleanup_type:
        type: choice
        description: 'Cleanup target'
        required: true
        default: 'analyze_only'
        options:
          - analyze_only
          - cache_only
          - runs_only
          - full_cleanup

      cache_pattern:
        type: choice
        description: 'Which ccache assets to prune'
        required: false
        default: 'superseded'
        options:
          # Same device+kernel, older clang rev. The restore fallback picks the
          # LEXICOGRAPHICALLY highest clang hash (`sort -r | head -1`), not the
          # newest, so extra revs can actively serve a staler cache.
          - superseded
          # Root flavour this repo no longer builds (e.g. RSKSU after the
          # ReSukiSu -> BakaSu rename).
          - foreign_flavour
          # Device model that no longer exists in configs/ (bisect one-offs,
          # renamed targets).
          - orphan_model
          - old_only
          - stale_only
          - all_caches

      keep_per_group:
        description: 'superseded: keep N newest per flavour+model+kernel group'
        required: false
        default: '1'

      device_filter:
        type: choice
        description: 'Limit the prune to one model or kernel version'
        required: false
        default: 'ALL'
        options:
          - ALL

          # Kernel versions (matched against the kernel field of the key)
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android12-5.10

          # OnePlus flagship / R / T
          - OP10pro
          - OP11
          - OP11-5.15.167
          - OP11-5.15.180
          - OP11r
          - OP12
          - OP12-6.1.118
          - OP12r
          - OP12r-5.15.167
          - OP13
          - OP13-6.6.89
          - OP13S
          - OP13S-6.6.89
          - OP13T
          - OP13T-6.6.89
          - OP13r
          - OP13r-6.1.118
          - OP13r-6.1.141
          - OP15-6.12.23
          - OP15-6.12.58
          - OP15-6.12.69
          - OP15-6.12.81
          - OP15T
          - OP15r

          # OnePlus Nord / N series
          - OP-N6-5.15.180
          - OP-N6-5.15.197
          - OP-N6X
          - OP-NORD-3
          - OP-NORD-4
          - OP-NORD-4-6.1.118
          - OP-NORD-4-6.1.157
          - OP-NORD-4-CE
          - OP-NORD-5
          - OP-NORD-5-6.1.118
          - OP-NORD-5-6.1.141
          - OP-NORD-6
          - OP-NORD-CE-5
          - OP-NORD-CE-5-6.1.134
          - OP-NORD-CE4-LITE
          - OP-NORD-CE4-LITE-6.1.118
          - OP-NORD-CE6
          - OP-NORD-CE6-LITE

          # OnePlus Ace / Turbo
          - OP-ACE-2
          - OP-ACE-2-PRO
          - OP-ACE-2V
          - OP-ACE-3
          - OP-ACE-3-5.15.167
          - OP-ACE-3-PRO
          - OP-ACE-3-PRO-6.1.118
          - OP-ACE-3V
          - OP-ACE-3V-6.1.118
          - OP-ACE-5
          - OP-ACE-5-6.1.118
          - OP-ACE-5-PRO
          - OP-ACE-5-PRO-6.6.89
          - OP-ACE-5-RACE
          - OP-ACE-5-RACE-6.1.134
          - OP-ACE-5-ULTRA
          - OP-ACE-5-ULTRA-6.6.89
          - OP-ACE-6
          - OP-ACE-6-6.6.89
          - OP-ACE-6-ULTRA
          - OP-ACE-6T
          - OP-TURBO-6
          - OP-TURBO-6V
          - OP-TURBO-6V-6.1.118
          - OP-TURBO-6X
          - OP-TURBO-6X-6.1.134

          # Tablets / foldables
          - OP-OPEN
          - OP-OPEN-5.15.167
          - OP-PAD-2-MT6991
          - OP-PAD-2-PRO
          - OP-PAD-2-PRO-6.6.89
          - OP-PAD-2-SM8650
          - OP-PAD-2-SM8650-6.1.118
          - OP-PAD-3-MT6897
          - OP-PAD-3-PRO
          - OP-PAD-3-SM8750
          - OP-PAD-3-SM8750-6.6.89
          - OP-PAD-4
          - OP-PAD-GO-2
          - OP-PAD-LITE
          - OP-PAD-MT6983
          - OP-PAD-PRO

      cache_age_days:
        description: 'old_only: age in days (stale_only uses 2x this)'
        required: false
        default: '30'

      ccache_budget_gb:
        description: 'Bucket size above which cleanup runs without force_cleanup'
        required: false
        default: '40'

      keep_recent_runs:
        description: 'Keep N most recent successful runs per workflow'
        required: false
        default: '3'

      days_to_keep:
        description: 'Keep workflow runs from the last N days'
        required: false
        default: '7'

      dry_run:
        description: 'Dry run: show what would be deleted'
        required: false
        type: boolean
        default: false

      force_cleanup:
        description: 'Prune even when the bucket is under budget'
        required: false
        type: boolean
        default: false

      prune_toolchain_cache:
        description: 'Also prune ORPHANED assets from the toolchain-cache release'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

env:
  CCACHE_BUCKET: ccache-cache
  TOOLCHAIN_BUCKET: toolchain-cache
  # The root flavour this repo builds. Anything else in the bucket is a leftover
  # from a rename or an experiment and is what `foreign_flavour` targets.
  KSU_FLAVOUR: KSUN

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  analyze:
    name: 📊 Analyze ccache bucket
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # listing DRAFT releases needs push access
    outputs:
      should_cleanup: ${{ steps.analysis.outputs.should_cleanup }}
      total_size: ${{ steps.analysis.outputs.total_size }}
      asset_count: ${{ steps.analysis.outputs.asset_count }}
      bucket_ok: ${{ steps.analysis.outputs.bucket_ok }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Collect live device models
        shell: bash
        run: |
          set -euo pipefail
          find configs -type f -name '*.json' -exec \
            jq -r '(if type=="array" then .[] else . end) | select(.model != null) | .model' {} \; \
            | sort -u > configs_models.txt
          echo "Live models: $(wc -l < configs_models.txt)"

      - name: 📊 Analyze
        id: analysis
        uses: actions/github-script@v9
        env:
          CCACHE_BUDGET_GB: ${{ inputs.ccache_budget_gb }}
          FORCE_CLEANUP: ${{ inputs.force_cleanup }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const BUCKET = process.env.CCACHE_BUCKET;
            const FLAVOUR = process.env.KSU_FLAVOUR;
            const budgetGB = Number.parseFloat(process.env.CCACHE_BUDGET_GB || '40');
            const force = process.env.FORCE_CLEANUP === 'true';

            const GB = b => (b / 1024 ** 3).toFixed(2);

            // A draft has no git tag: releases/tags/<tag> 404s. List and match.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const buckets = releases.filter(r => r.tag_name === BUCKET);

            core.setOutput('bucket_ok', String(buckets.length === 1));

            if (buckets.length === 0) {
              core.setOutput('should_cleanup', 'false');
              core.setOutput('total_size', '0');
              core.setOutput('asset_count', '0');
              await core.summary
                .addHeading(`⚠️ No \`${BUCKET}\` release`)
                .addRaw('Nothing to analyze. The first build will create it.\n')
                .write();
              return;
            }

            if (buckets.length > 1) {
              // This is the failure that cost KsuNext a 3% ccache hit rate for
              // ten days: restore read one empty draft while save wrote another.
              core.setFailed(
                `${buckets.length} releases share tag_name '${BUCKET}' ` +
                `(ids: ${buckets.map(b => b.id).join(', ')}). ` +
                `restore/save pick the first match independently, so builds can ` +
                `read an empty bucket while writing a full one. Delete the empty ` +
                `duplicate before pruning anything.`
              );
              await core.summary
                .addHeading('🔴 Duplicate cache bucket')
                .addTable([
                  [{ data: 'Release id', header: true }, { data: 'Created', header: true }, { data: 'Assets', header: true }],
                  ...buckets.map(b => [String(b.id), b.created_at.split('T')[0], String(b.assets?.length ?? '?')]),
                ])
                .write();
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: buckets[0].id, per_page: 100,
            });

            const liveModels = new Set(
              fs.readFileSync('configs_models.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean)
            );

            // cache-<FLAVOUR>-v<N>-<MODEL>-<OS>-<android..>-<flagfp>-<clang>.tzst[.partXX]
            // <flagfp> is optional so pre-v4 names still parse and stay prunable.
            const CACHE_SCHEMA = 4;
            const KEY_RE = /^cache-([A-Za-z0-9]+)-v(\d+)-(.+)-(A\d+)-(android\d+-[\d.]+)(?:-([0-9a-f]{8}))?-([0-9a-f]+)\.(tzst|tar)(\.part[a-z]{2})?$/;

            let total = 0;
            const byFlavour = new Map();
            const byModel = new Map();
            const groups = new Map();      // flavour|model|os|kernel -> count
            let unparsed = 0;
            let orphanModelBytes = 0;
            let foreignBytes = 0;
            let staleSchemaBytes = 0;

            for (const a of assets) {
              total += a.size;
              const m = KEY_RE.exec(a.name);
              if (!m) { unparsed++; continue; }

              const [, flavour, ver, model, os, kernel, flagfp] = m;

              byFlavour.set(flavour, (byFlavour.get(flavour) || 0) + a.size);
              byModel.set(model, (byModel.get(model) || 0) + a.size);

              const gk = `${flavour}|${model}|${os}|${kernel}|v${ver}|${flagfp || '-'}`;
              groups.set(gk, (groups.get(gk) || 0) + 1);
              if (Number(ver) < CACHE_SCHEMA) staleSchemaBytes += a.size;

              if (flavour !== FLAVOUR) foreignBytes += a.size;
              if (!liveModels.has(model)) orphanModelBytes += a.size;
            }

            const supersededGroups = Array.from(groups.values()).filter(n => n > 1).length;
            const shouldCleanup = force || (total / 1024 ** 3) > budgetGB;

            core.setOutput('should_cleanup', String(shouldCleanup));
            core.setOutput('total_size', String(total));
            core.setOutput('asset_count', String(assets.length));

            const health = (total / 1024 ** 3) > budgetGB ? '🟡' : '🟢';

            const summary = core.summary
              .addHeading(`${health} ccache bucket — \`${BUCKET}\``)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Assets', String(assets.length)],
                ['Total size', `${GB(total)} GB`],
                ['Budget', `${budgetGB.toFixed(0)} GB`],
                ['Unparseable names', String(unparsed)],
                ['Groups with >1 clang rev', String(supersededGroups)],
                ['Unreachable (old key schema)', `${(staleSchemaBytes / 1024 ** 3).toFixed(2)} GB`],
                [`Foreign flavour (not ${FLAVOUR})`, `${GB(foreignBytes)} GB`],
                ['Model gone from configs/', `${GB(orphanModelBytes)} GB`],
                ['Cleanup needed', shouldCleanup ? 'Yes' : 'No'],
              ]);

            if (byFlavour.size > 0) {
              summary.addRaw('\n### 🌿 By root flavour\n\n').addTable([
                [{ data: 'Flavour', header: true }, { data: 'Size (GB)', header: true }, { data: 'Status', header: true }],
                ...Array.from(byFlavour.entries()).sort((a, b) => b[1] - a[1]).map(([f, s]) => [
                  f, GB(s), f === FLAVOUR ? 'current' : '⚠️ foreign',
                ]),
              ]);
            }

            const topModels = Array.from(byModel.entries()).sort((a, b) => b[1] - a[1]).slice(0, 25);
            if (topModels.length > 0) {
              summary.addRaw('\n### 📱 Top 25 models by size\n\n').addTable([
                [{ data: 'Model', header: true }, { data: 'Size (GB)', header: true }, { data: 'In configs/', header: true }],
                ...topModels.map(([m, s]) => [m, GB(s), liveModels.has(m) ? 'yes' : '⚠️ no']),
              ]);
            }

            await summary.write();
            console.log(`${assets.length} assets, ${GB(total)} GB, cleanup=${shouldCleanup}`);

  # ───────────────────────────────────────────────────────────────────────────
  cleanup-ccache:
    name: 🗑️ Prune ccache bucket
    runs-on: ubuntu-24.04
    needs: analyze
    permissions:
      contents: write
    if: |
      needs.analyze.result == 'success' &&
      (inputs.cleanup_type == 'cache_only' || inputs.cleanup_type == 'full_cleanup')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Collect live device models
        shell: bash
        run: |
          set -euo pipefail
          find configs -type f -name '*.json' -exec \
            jq -r '(if type=="array" then .[] else . end) | select(.model != null) | .model' {} \; \
            | sort -u > configs_models.txt

      - name: 🗑️ Prune
        uses: actions/github-script@v9
        env:
          CACHE_PATTERN: ${{ inputs.cache_pattern }}
          DEVICE_FILTER: ${{ inputs.device_filter }}
          KEEP_PER_GROUP: ${{ inputs.keep_per_group }}
          CACHE_AGE_DAYS: ${{ inputs.cache_age_days }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_CLEANUP: ${{ inputs.force_cleanup }}
          SHOULD_CLEANUP: ${{ needs.analyze.outputs.should_cleanup }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const BUCKET = process.env.CCACHE_BUCKET;
            const FLAVOUR = process.env.KSU_FLAVOUR;
            const pattern = process.env.CACHE_PATTERN;
            const deviceFilter = process.env.DEVICE_FILTER;
            const keepPerGroup = Math.max(1, Number.parseInt(process.env.KEEP_PER_GROUP || '1', 10) || 1);
            const ageDays = Number.parseInt(process.env.CACHE_AGE_DAYS || '30', 10);
            const dryRun = process.env.DRY_RUN === 'true';
            const force = process.env.FORCE_CLEANUP === 'true';
            const shouldCleanup = process.env.SHOULD_CLEANUP === 'true';

            const GB = b => (b / 1024 ** 3).toFixed(2);
            const MB = b => (b / 1024 ** 2).toFixed(0);
            const ageOf = d => Math.floor((Date.now() - new Date(d).getTime()) / 86400000);

            if (!shouldCleanup && !force && !dryRun) {
              await core.summary
                .addHeading('ℹ️ Prune skipped')
                .addRaw('Bucket is under budget. Re-run with `force_cleanup: true` to prune anyway.\n')
                .write();
              return;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const buckets = releases.filter(r => r.tag_name === BUCKET);

            if (buckets.length !== 1) {
              core.setFailed(`Expected exactly 1 release tagged '${BUCKET}', found ${buckets.length}.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: buckets[0].id, per_page: 100,
            });

            const liveModels = new Set(
              fs.readFileSync('configs_models.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean)
            );

            const CACHE_SCHEMA = 4;
            const KEY_RE = /^cache-([A-Za-z0-9]+)-v(\d+)-(.+)-(A\d+)-(android\d+-[\d.]+)(?:-([0-9a-f]{8}))?-([0-9a-f]+)\.(tzst|tar)(\.part[a-z]{2})?$/;

            // A >2 GB cache is uploaded split as <base>.partaa/.partab. Those parts
            // are one logical cache: fold them so a prune never strips half of one.
            const items = new Map();
            for (const a of assets) {
              const base = a.name.replace(/\.part[a-z]{2}$/, '');
              let it = items.get(base);
              if (!it) {
                const m = KEY_RE.exec(a.name);
                it = {
                  base,
                  ids: [],
                  size: 0,
                  updated: a.updated_at,
                  parsed: Boolean(m),
                  flavour: m ? m[1] : null,
                  model: m ? m[3] : null,
                  os: m ? m[4] : null,
                  kernel: m ? m[5] : null,
                  ver: m ? m[2] : null,
                  flagfp: m ? m[6] : null,
                  clang: m ? m[7] : null,
                };
                items.set(base, it);
              }
              it.ids.push(a.id);
              it.size += a.size;
              if (new Date(a.updated_at) > new Date(it.updated)) it.updated = a.updated_at;
            }

            const matchesFilter = it => {
              if (deviceFilter === 'ALL') return true;
              if (!it.parsed) return false;
              // Kernel-version filters (android16-6.12) match the kernel field;
              // model filters must match the model field exactly, so OP15 never
              // sweeps up OP15T/OP15r.
              return it.model === deviceFilter || it.kernel.startsWith(deviceFilter);
            };

            // superseded: within flavour+model+os+kernel+flagfp, the restore fallback key
            // `<flavour>-v4-<model>-<os>-<kernel>-<flagfp>-` can only ever serve one asset,
            // so every extra clang rev is dead weight. An asset from an older key schema
            // is unreachable by any key the builder now emits, so it is superseded outright
            // -- without this, bumping the schema would strand a full bucket as dead weight.
            const supersededIds = new Set();
            if (pattern === 'superseded') {
              const groups = new Map();
              for (const it of items.values()) {
                if (!it.parsed) continue;
                if (Number(it.ver) < CACHE_SCHEMA) { supersededIds.add(it.base); continue; }
                const gk = `${it.flavour}|${it.model}|${it.os}|${it.kernel}|${it.flagfp || '-'}`;
                if (!groups.has(gk)) groups.set(gk, []);
                groups.get(gk).push(it);
              }
              for (const list of groups.values()) {
                list.sort((a, b) => new Date(b.updated) - new Date(a.updated));
                for (const it of list.slice(keepPerGroup)) supersededIds.add(it.base);
              }
            }

            const decide = (it) => {
              if (!matchesFilter(it)) return false;
              switch (pattern) {
                case 'superseded':      return supersededIds.has(it.base);
                case 'foreign_flavour': return it.parsed && it.flavour !== FLAVOUR;
                case 'orphan_model':    return it.parsed && !liveModels.has(it.model);
                case 'old_only':        return ageOf(it.updated) >= ageDays;
                case 'stale_only':      return ageOf(it.updated) >= ageDays * 2;
                case 'all_caches':      return true;
                default:                return false;
              }
            };

            const victims = Array.from(items.values()).filter(decide).sort((a, b) => b.size - a.size);

            console.log(`pattern=${pattern} filter=${deviceFilter} dry_run=${dryRun}`);
            console.log(`${items.size} logical caches, ${victims.length} selected.`);

            let freed = 0, deleted = 0;
            const failed = [];

            for (const it of victims) {
              console.log(`${dryRun ? '🔍 would delete' : '🗑️ deleting'} ${it.base} (${MB(it.size)} MB, ${ageOf(it.updated)}d)`);
              if (dryRun) { deleted++; freed += it.size; continue; }
              try {
                for (const id of it.ids) {
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: id });
                }
                deleted++;
                freed += it.size;
              } catch (e) {
                console.log(`   ⚠️ ${e.message}`);
                failed.push([it.base, e.message]);
              }
            }

            const summary = core.summary
              .addHeading(`🧹 ccache prune ${dryRun ? 'preview' : 'summary'}`)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Pattern', pattern],
                ['Device filter', deviceFilter],
                [dryRun ? 'Would delete' : 'Deleted', String(deleted)],
                [dryRun ? 'Would free' : 'Freed', `${GB(freed)} GB`],
                ['Kept', String(items.size - deleted)],
                ['Dry run', dryRun ? 'Yes' : 'No'],
              ]);

            if (victims.length > 0) {
              summary.addRaw(`\n### 📦 Largest 25 ${dryRun ? 'candidates' : 'processed'}\n\n`).addTable([
                [
                  { data: 'Cache', header: true },
                  { data: 'Size (MB)', header: true },
                  { data: 'Age (d)', header: true },
                  { data: 'Model', header: true },
                ],
                ...victims.slice(0, 25).map(it => [it.base, MB(it.size), String(ageOf(it.updated)), it.model || '—']),
              ]);
            }

            if (failed.length > 0) {
              summary.addRaw('\n### ⚠️ Failed deletions\n\n').addTable([
                [{ data: 'Cache', header: true }, { data: 'Reason', header: true }],
                ...failed,
              ]);
            }

            await summary.write();

  # ───────────────────────────────────────────────────────────────────────────
  cleanup-toolchains:
    name: 🧰 Prune orphaned toolchains
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ inputs.prune_toolchain_cache }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Age is meaningless for this bucket: a sha-keyed asset is uploaded once
      # and never rewritten, so `updated_at` is the date it was FIRST mirrored,
      # not the date it was last needed. The old age-based prune would therefore
      # have deleted the entire live mirror the moment it crossed the threshold.
      # The only sound signal is reachability: resolve what configs/ currently
      # pins and delete the complement.
      - name: Resolve required toolchains
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_toolchain_assets.py \
            --configs-dir configs \
            --manifests-dir manifests \
            --format json \
            --output toolchains.json
          jq -r '"resolved=\(.count) processed=\(.processed) failed=\(.failed)"' toolchains.json

      - name: 🧰 Prune
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const BUCKET = process.env.TOOLCHAIN_BUCKET;
            const dryRun = process.env.DRY_RUN === 'true';
            const GB = b => (b / 1024 ** 3).toFixed(2);

            const resolved = JSON.parse(fs.readFileSync('toolchains.json', 'utf8'));

            // An unresolved config's toolchains look exactly like orphans. Refuse
            // to delete anything rather than wipe a live toolchain on a transient
            // manifest fetch failure.
            if (resolved.failed > 0) {
              core.setFailed(
                `${resolved.failed} config(s) failed to resolve, so the required ` +
                `toolchain set is incomplete and pruning would delete live assets. ` +
                `First failure: ${JSON.stringify(resolved.failures[0])}`
              );
              return;
            }

            if (resolved.count === 0) {
              core.setFailed('Resolved 0 toolchains — refusing to treat the whole mirror as orphaned.');
              return;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const buckets = releases.filter(r => r.tag_name === BUCKET);

            if (buckets.length === 0) {
              await core.summary.addHeading(`ℹ️ No \`${BUCKET}\` release`).write();
              return;
            }
            if (buckets.length > 1) {
              core.setFailed(`${buckets.length} releases share tag_name '${BUCKET}'; resolve the duplicate first.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: buckets[0].id, per_page: 100,
            });

            const required = new Set(resolved.assets);
            const victims = [];
            let keptBytes = 0;

            for (const a of assets) {
              // <name>.tar.gz.partaa is part of logical asset <name>.tar.gz.
              const base = a.name.replace(/\.part[a-z]{2}$/, '');
              if (required.has(base)) { keptBytes += a.size; continue; }
              victims.push(a);
            }

            let freed = 0, deleted = 0;
            const failed = [];

            for (const a of victims) {
              console.log(`${dryRun ? '🔍 would delete' : '🗑️ deleting'} ${a.name} (${GB(a.size)} GB)`);
              if (dryRun) { deleted++; freed += a.size; continue; }
              try {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
                deleted++;
                freed += a.size;
              } catch (e) {
                console.log(`   ⚠️ ${e.message}`);
                failed.push([a.name, e.message]);
              }
            }

            const summary = core.summary
              .addHeading(`🧰 Toolchain prune ${dryRun ? 'preview' : 'summary'}`)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Required by configs/', String(resolved.count)],
                ['Assets in mirror', String(assets.length)],
                ['Orphaned', String(victims.length)],
                [dryRun ? 'Would free' : 'Freed', `${GB(freed)} GB`],
                ['Kept', `${GB(keptBytes)} GB`],
                ['Dry run', dryRun ? 'Yes' : 'No'],
              ]);

            if (victims.length > 0) {
              summary.addRaw('\n### 🗑️ Orphaned assets\n\n').addTable([
                [{ data: 'Asset', header: true }, { data: 'Size (GB)', header: true }, { data: 'Mirrored', header: true }],
                ...victims.map(a => [a.name, GB(a.size), a.updated_at.split('T')[0]]),
              ]);
            } else {
              summary.addRaw('\n✅ Mirror is exactly the set configs/ requires — nothing to prune.\n');
            }

            if (failed.length > 0) {
              summary.addRaw('\n### ⚠️ Failed deletions\n\n').addTable([
                [{ data: 'Asset', header: true }, { data: 'Reason', header: true }],
                ...failed,
              ]);
            }

            await summary.write();

  # ───────────────────────────────────────────────────────────────────────────
  cleanup-runs:
    name: 🗑️ Prune workflow runs
    runs-on: ubuntu-24.04
    if: |
      inputs.cleanup_type == 'runs_only' || inputs.cleanup_type == 'full_cleanup'

    steps:
      - name: 🗑️ Clean old workflow runs
        uses: actions/github-script@v9
        env:
          KEEP_RECENT_RUNS: ${{ inputs.keep_recent_runs }}
          DAYS_TO_KEEP: ${{ inputs.days_to_keep }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const keepRecent = Number.parseInt(process.env.KEEP_RECENT_RUNS || '3', 10);
            const daysToKeep = Number.parseInt(process.env.DAYS_TO_KEEP || '7', 10);
            const dryRun = process.env.DRY_RUN === 'true';

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - daysToKeep);

            const ageOf = d => Math.floor((Date.now() - new Date(d).getTime()) / 86400000);

            const DELETABLE = new Set([
              'failure', 'cancelled', 'skipped', 'timed_out',
              'action_required', 'startup_failure', 'neutral', 'stale',
            ]);

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner, repo, per_page: 100,
            });

            let totalDeleted = 0, totalFailed = 0, totalWould = 0;
            const stats = [];

            for (const wf of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: wf.id, per_page: 100,
              });

              const protectedIds = new Set(
                runs.filter(r => r.conclusion === 'success')
                    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                    .slice(0, keepRecent)
                    .map(r => r.id)
              );

              const counts = { success: 0, failure: 0, cancelled: 0, other: 0 };
              let del = 0, fail = 0, would = 0;

              for (const run of runs) {
                // Never delete the run doing the deleting, or anything still live.
                if (run.id === context.runId) continue;
                if (run.status !== 'completed') continue;

                const c = run.conclusion || 'other';
                if (c in counts) counts[c]++; else counts.other++;

                if (new Date(run.created_at) >= cutoff) continue;

                const deletable = c === 'success' ? !protectedIds.has(run.id) : DELETABLE.has(c);
                if (!deletable) continue;

                if (dryRun) {
                  console.log(`🔍 would delete ${wf.name} #${run.run_number} (${c}, ${ageOf(run.created_at)}d)`);
                  would++; totalWould++;
                  continue;
                }

                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                  del++; totalDeleted++;
                } catch (e) {
                  console.log(`   ⚠️ ${wf.name} #${run.run_number}: ${e.message}`);
                  fail++; totalFailed++;
                }
              }

              if (runs.length > 0) {
                stats.push({ name: wf.name, del, fail, would, counts });
              }
            }

            const summary = core.summary
              .addHeading(`🧹 Workflow runs ${dryRun ? 'preview' : 'summary'}`)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                [dryRun ? 'Would delete' : 'Deleted', String(dryRun ? totalWould : totalDeleted)],
                ['Failed deletions', String(totalFailed)],
                ['Kept recent successful', String(keepRecent)],
                ['Days kept', String(daysToKeep)],
                ['Dry run', dryRun ? 'Yes' : 'No'],
              ]);

            if (stats.length > 0) {
              summary.addRaw('\n### 📊 Per workflow\n\n').addTable([
                [
                  { data: 'Workflow', header: true },
                  { data: dryRun ? 'Would delete' : 'Deleted', header: true },
                  { data: 'Failed', header: true },
                  { data: 'Success', header: true },
                  { data: 'Failure', header: true },
                  { data: 'Cancelled', header: true },
                ],
                ...stats.map(s => [
                  s.name, String(dryRun ? s.would : s.del), String(s.fail),
                  String(s.counts.success), String(s.counts.failure), String(s.counts.cancelled),
                ]),
              ]);
            }

            await summary.write();

  # ───────────────────────────────────────────────────────────────────────────
  final-report:
    name: 📊 Final report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - analyze
      - cleanup-ccache
      - cleanup-toolchains
      - cleanup-runs
    if: always() && needs.analyze.result == 'success'

    steps:
      - name: 📊 Bucket state after cleanup
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BEFORE_SIZE: ${{ needs.analyze.outputs.total_size }}
          BEFORE_COUNT: ${{ needs.analyze.outputs.asset_count }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const GB = b => (b / 1024 ** 3).toFixed(2);

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });

            const rows = [];
            let ccacheNow = 0, ccacheCount = 0;

            for (const tag of [process.env.CCACHE_BUCKET, process.env.TOOLCHAIN_BUCKET]) {
              const bucket = releases.find(r => r.tag_name === tag);
              if (!bucket) { rows.push([tag, '—', '—', 'missing']); continue; }

              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: bucket.id, per_page: 100,
              });
              const size = assets.reduce((a, b) => a + b.size, 0);
              rows.push([tag, String(assets.length), GB(size), 'ok']);

              if (tag === process.env.CCACHE_BUCKET) { ccacheNow = size; ccacheCount = assets.length; }
            }

            const beforeSize = Number.parseFloat(process.env.BEFORE_SIZE || '0');
            const beforeCount = Number.parseInt(process.env.BEFORE_COUNT || '0', 10);

            const summary = core.summary
              .addHeading('📊 Final bucket state')
              .addRaw(dryRun ? '\n**⚠️ DRY RUN — nothing was deleted.**\n\n' : '\n')
              .addTable([
                [
                  { data: 'Bucket', header: true },
                  { data: 'Assets', header: true },
                  { data: 'Size (GB)', header: true },
                  { data: 'State', header: true },
                ],
                ...rows,
              ]);

            if (!dryRun && beforeSize > 0) {
              summary.addRaw('\n### 📈 Impact\n\n')
                .addRaw(`- **Freed:** ${GB(beforeSize - ccacheNow)} GB\n`)
                .addRaw(`- **Caches removed:** ${beforeCount - ccacheCount}\n`);
            }

            summary.addRaw('\n### 💡 Next steps\n\n');
            if (dryRun) {
              summary.addRaw('- Re-run with `dry_run: false` to apply.\n');
            } else {
              summary
                .addRaw('- `superseded` is safe to run weekly; it only drops clang revs and old key schemas the restore fallback can never reach.\n')
                .addRaw('- `foreign_flavour` and `orphan_model` are one-offs after a rename or a bisect campaign.\n');
            }

            await summary.write();

      - name: 💡 Quick action commands
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'

          ---

          ## 🚀 Quick action commands

          ### Analyze only

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=analyze_only
          ```

          ### Preview the default prune

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=cache_only -f cache_pattern=superseded -f dry_run=true
          ```

          ### Drop superseded clang revs (keep newest per device+kernel)

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=cache_only -f cache_pattern=superseded -f force_cleanup=true
          ```

          ### Drop caches from a root flavour this repo no longer builds

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=cache_only -f cache_pattern=foreign_flavour -f force_cleanup=true
          ```

          ### Drop caches for models no longer in configs/

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=cache_only -f cache_pattern=orphan_model -f force_cleanup=true
          ```

          ### Drop every cache for one device

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=cache_only -f cache_pattern=all_caches -f device_filter=OP15-6.12.69 -f force_cleanup=true
          ```

          ### Prune orphaned toolchain mirror assets

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=analyze_only -f prune_toolchain_cache=true -f dry_run=true
          ```

          ### Clean old workflow runs

          ```bash
          gh workflow run clean-up.yml -f cleanup_type=runs_only -f days_to_keep=7 -f keep_recent_runs=3
          ```

          EOF
# ci: register on default branch
