    - name: Apply BBRv3
      if: ${{ env.OP_BBR3 == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply BBRv3 patches"
        cd "$COMMON_KERNEL_FOLDER"

        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR3=y
        EOF

        BBR3_DIR="${BOUTEILLE_BBR3_PATCHES_FOLDER:-$GITHUB_WORKSPACE/bouton_kernel_patches/common/bbrv3}"

        if [ ! -d "$BBR3_DIR" ]; then
          echo "::error::Bouteillepleine BBRv3 patch directory not found: $BBR3_DIR"
          exit 1
        fi

        MAIN_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-$ANDROID_VER-$KERNEL_VER.patch"
        DEBUGFS_PATCH="$BBR3_DIR/0002-net-tcp-bbr3-add-debugfs-diagnostics-and-runtime-tunables.patch"

        if [ ! -f "$MAIN_PATCH" ]; then
          echo "::error::BBRv3 patch not found for $ANDROID_VER-$KERNEL_VER"
          echo "Expected: $MAIN_PATCH"
          echo ""
          echo "Available BBRv3 patches:"
          find "$BBR3_DIR" -maxdepth 1 -type f -name "*.patch" -print | sort
          exit 1
        fi

        echo "Using BBRv3 source: Bouteillepleine/kernel_patches"
        echo "Patch directory: $BBR3_DIR"
        echo "Applying main patch: $(basename "$MAIN_PATCH")"
        patch -p1 < "$MAIN_PATCH"

        if [ "$ANDROID_VER" = "android16" ] && [ "$KERNEL_VER" = "6.12" ]; then
          if [ ! -f "$DEBUGFS_PATCH" ]; then
            echo "::error::Required BBRv3 debugfs/tunables patch missing for android16-6.12"
            echo "Expected: $DEBUGFS_PATCH"
            exit 1
          fi

          echo "Applying 6.12-only debugfs/tunables patch: $(basename "$DEBUGFS_PATCH")"
          patch -p1 < "$DEBUGFS_PATCH"
        else
          echo "Skipping debugfs/tunables patch for $ANDROID_VER-$KERNEL_VER"
        fi
        
        if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
          echo "proc_dou8vec_minmax() missing from this tree - applying sysctl backports"
          for p in sysctl_add_proc_dou8vec_minmax.patch \
                   sysctl_fix_data-races_in_proc_dou8vec_minmax.patch; do
            if [ ! -f "$BBR3_DIR/$p" ]; then
              echo "::error::BBRv3 needs $p but it is missing from $BBR3_DIR"
              echo "Without it, $ANDROID_VER-$KERNEL_VER cannot compile BBRv3."
              exit 1
            fi
            echo "Applying $p"
            patch -p1 < "$BBR3_DIR/$p"
          done
        else
          echo "proc_dou8vec_minmax() already present - skipping sysctl backports"
        fi

        echo "✅ BBRv3 patches applied from Bouteillepleine/kernel_patches"
        echo "::endgroup::"

