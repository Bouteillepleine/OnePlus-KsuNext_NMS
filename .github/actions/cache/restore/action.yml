name: 'Restore Cache'

inputs:
  cache_path:
    description: 'Path where cache should be restored'
    required: true
    type: string
  cache_key:
    description: 'Primary key to restore cache'
    required: true
    type: string
  restore_keys:
    description: 'Multiline list of keys (fallback prefixes)'
    required: false
    type: string
    default: ""
  cache_bucket:
    description: 'The tag name for the release (e.g., general-cache)'
    required: true
    default: 'general-cache'
  github_token:
    description: 'GitHub Token (falls back to the workflow token)'
    required: false
    default: ''
  debug:
    description: 'Enable Logs'
    required: false
    type: boolean
    default: false

runs:
  using: 'composite'
  steps:
    - name: Detect and Download Cache
      shell: bash
      env:
        TARGET_REPO: "${{ github.repository }}"
        GH_TOKEN: ${{ inputs.github_token != '' && inputs.github_token || github.token }}
      run: |
        if [ "${{ inputs.debug }}" = "true" ]; then set -x; fi

        cd "$GITHUB_WORKSPACE"

        TAG_NAME="${{ inputs.cache_bucket }}"

        ARIA2_OPTS=(
          "-x16" "-s16" "-k1M" "-j5" "--file-allocation=none" "--allow-overwrite=true"
          "--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          "--header=Accept: */*"
          "--header=Connection: keep-alive"
        )

        if [ "${{ inputs.debug }}" != "true" ]; then
          ARIA2_OPTS+=("--quiet" "--summary-interval=0" "--console-log-level=error")
        fi

        # ──────────────────────────────────────────────
        # FETCH ASSET LIST
        # ──────────────────────────────────────────────
        echo "::group:: Fetching Asset List"

        # This repo is private and the cache release is a DRAFT, so the public
        # expanded_assets page and releases/download/<tag>/<file> both 404 — the
        # old scrape silently returned nothing on every single build. Go through
        # the authenticated REST API: list the releases (drafts included for a
        # push-access token), match on tag_name, then page that release's assets.
        REL_LIST="$(gh api --paginate "repos/$TARGET_REPO/releases" \
                      --jq ".[] | select(.tag_name == \"$TAG_NAME\") | .id" 2>/dev/null || true)"
        REL_ID="$(printf '%s\n' "$REL_LIST" | sed -n '/./{p;q}')"

        if [ -z "$REL_ID" ]; then
          echo "No release found for bucket '$TAG_NAME'. Skipping search."
          echo "::endgroup::"
          exit 0
        fi

        ASSET_TSV="$(gh api --paginate "repos/$TARGET_REPO/releases/$REL_ID/assets" \
                       --jq '.[] | "\(.name)\t\(.id)"' 2>/dev/null || true)"

        declare -A ASSET_ID=()
        while IFS=$'\t' read -r _a_name _a_id; do
          if [ -n "${_a_name:-}" ]; then
            ASSET_ID["$_a_name"]="$_a_id"
          fi
        done <<< "$ASSET_TSV"

        ALL_ASSETS="$(printf '%s\n' "${!ASSET_ID[@]}" | sed '/^$/d' | sort -u)"

        if [ -z "$ALL_ASSETS" ]; then
          echo "No assets found in bucket '$TAG_NAME'. Skipping search."
          echo "::endgroup::"
          exit 0
        fi

        echo "Successfully fetched asset list. Has $(echo "$ALL_ASSETS" | wc -l) assets."
        echo "::endgroup::"

        # ──────────────────────────────────────────────
        # SEARCH
        # ──────────────────────────────────────────────
        SEARCH_LIST=$(printf "%s\n%s" "${{ inputs.cache_key }}" "${{ inputs.restore_keys }}" | sed '/^$/d')

        FOUND=false

        while read -r KEY; do
          [ -z "$KEY" ] && continue
          echo "::group:: Searching Prefix: $KEY"

          MATCH=$(echo "$ALL_ASSETS" | grep "^cache-$KEY" | sort -r | head -n 1 || true)

          if [ -z "$MATCH" ]; then
            echo "Not found."
            echo "::endgroup::"
            continue
          fi

          BASE_FILENAME=$(echo "$MATCH" | sed -E 's/\.(tzst|tar)(\.part[a-z]{2})?$//')
          EXT=$(echo "$MATCH" | grep -oP '\.(tzst|tar)' | head -n 1)

          [[ "$MATCH" == *".part"* ]] && IS_SPLIT=true  || IS_SPLIT=false
          [ "$EXT" = ".tzst" ]        && COMPRESSED=true || COMPRESSED=false
          FOUND=true

          echo "✅ Hit! Restoring $BASE_FILENAME$EXT"
          echo "   Split:      $IS_SPLIT"
          echo "   Compressed: $COMPRESSED"
          echo "::endgroup::"

          # ──────────────────────────────────────────────
          # DOWNLOAD
          # ──────────────────────────────────────────────
          echo "::group:: Downloading Cache"

          asset_url() {
            # Release assets are served from a short-lived signed URL that the API
            # 302s to, so this is re-resolved on every attempt rather than cached.
            # The `|| true` matters: composite `shell: bash` runs with -e, and a
            # failing command substitution would otherwise kill the whole step.
            local id="$1"
            curl -sS -o /dev/null -w '%{redirect_url}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$TARGET_REPO/releases/assets/$id" || true
          }

          download_asset() {
            local filename="$1"
            local asset_id="$2"
            local max_retries=3
            local attempt=1
            local url

            while [ "$attempt" -le "$max_retries" ]; do
              echo "  Attempt $attempt: Downloading $filename..."

              url="$(asset_url "$asset_id")"
              if [ -z "$url" ]; then
                echo "  ⚠️ Could not resolve a download URL for asset $asset_id. Retrying in 5s..."
                sleep 5
                attempt=$((attempt + 1))
                continue
              fi

              if timeout 10m aria2c "${ARIA2_OPTS[@]}" \
                  --retry-wait=10 --max-tries=10 \
                  -o "$filename" "$url"; then

                local dl_size
                dl_size="$(stat -c%s "$filename" 2>/dev/null || echo 0)"
                if [ "$dl_size" -lt 1024 ]; then
                  echo "  ⚠️ Downloaded file suspiciously small (${dl_size} bytes). Retrying..."
                  rm -f "$filename"
                else
                  echo "  ✅ Downloaded: $filename ($(numfmt --to=iec-i --suffix=B "$dl_size"))"
                  return 0
                fi
              fi

              echo "  ⚠️ Download failed or timed out. Retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done

            return 1
          }

          if [ "$IS_SPLIT" = "true" ]; then
            for part in {a..z}{a..z}; do
              PART_NAME="$BASE_FILENAME$EXT.part${part}"
              if echo "$ALL_ASSETS" | grep -q "^${PART_NAME}$"; then
                if ! download_asset "$PART_NAME" "${ASSET_ID[$PART_NAME]}"; then
                  echo "::error::Failed to download $PART_NAME after multiple retries."
                  exit 1
                fi
              else
                break
              fi
            done
          else
            if ! download_asset "$BASE_FILENAME$EXT" "${ASSET_ID[$BASE_FILENAME$EXT]}"; then
              echo "::error::Failed to download $BASE_FILENAME$EXT after multiple retries."
              exit 1
            fi
          fi

          echo "::endgroup::"

          # ──────────────────────────────────────────────
          # EXTRACT
          # ──────────────────────────────────────────────
          echo "::group:: Extracting Cache"

          FINAL_ARCHIVE="$BASE_FILENAME$EXT"
          CACHE_PATH="${{ inputs.cache_path }}"

          # ✅ FIX — extraire directement dans cache_path
          #          l'archive contient "." comme racine (contenu direct)
          #          → mkdir cache_path + tar -C cache_path = restauration exacte
          mkdir -p "$CACHE_PATH"

          echo "  cache_path:  $CACHE_PATH"

          extract_cache() {
            local cmd="$1"
            if [ "${{ inputs.debug }}" = "true" ]; then
              sh -c "$cmd"
            else
              sh -c "$cmd" 2>&1 | tail -n 5 || true
            fi
          }

          if [ "$IS_SPLIT" = "true" ]; then

            PARTS_LIST=()
            for part in {a..z}{a..z}; do
              PART_FILE="$FINAL_ARCHIVE.part${part}"
              if [ -f "$PART_FILE" ]; then
                PART_SIZE="$(stat -c%s "$PART_FILE" 2>/dev/null || echo 0)"
                if [ "$PART_SIZE" -lt 1024 ]; then
                  echo "::error::Part file suspiciously small (${PART_SIZE} bytes): $PART_FILE"
                  exit 1
                fi
                PARTS_LIST+=("$PART_FILE")
              else
                break
              fi
            done

            if [ "${#PARTS_LIST[@]}" -eq 0 ]; then
              echo "::error::No part files found matching $FINAL_ARCHIVE.part*"
              exit 1
            fi

            echo "Found ${#PARTS_LIST[@]} part(s):"
            for p in "${PARTS_LIST[@]}"; do
              echo "  $p ($(numfmt --to=iec-i --suffix=B "$(stat -c%s "$p")"))"
            done

            if [ "$COMPRESSED" = "true" ]; then
              if ! cat "${PARTS_LIST[@]}" | zstd -d -T0 --test > /dev/null 2>&1; then
                echo "::warning::zstd stream integrity check failed — attempting extraction anyway"
              else
                echo "✅ zstd stream integrity check passed"
              fi
              extract_cache "cat $(printf '%q ' "${PARTS_LIST[@]}") | tar -I 'zstd -d -T0' -xf - -C $(printf '%q' "$CACHE_PATH")"
            else
              extract_cache "cat $(printf '%q ' "${PARTS_LIST[@]}") | tar -xf - -C $(printf '%q' "$CACHE_PATH")"
            fi

            rm -f "${PARTS_LIST[@]}"

          else

            ARCHIVE_SIZE="$(stat -c%s "$FINAL_ARCHIVE" 2>/dev/null || echo 0)"
            if [ "$ARCHIVE_SIZE" -lt 1024 ]; then
              echo "::error::Archive file suspiciously small (${ARCHIVE_SIZE} bytes): $FINAL_ARCHIVE"
              exit 1
            fi
            echo "Archive size: $(numfmt --to=iec-i --suffix=B "$ARCHIVE_SIZE")"

            if [ "$COMPRESSED" = "true" ]; then
              if ! zstd -d -T0 --test "$FINAL_ARCHIVE" > /dev/null 2>&1; then
                echo "::warning::zstd integrity check failed — attempting extraction anyway"
              else
                echo "✅ zstd integrity check passed"
              fi
              extract_cache "tar -I 'zstd -d -T0' -xf $(printf '%q' "$FINAL_ARCHIVE") -C $(printf '%q' "$CACHE_PATH")"
            else
              extract_cache "tar -xf $(printf '%q' "$FINAL_ARCHIVE") -C $(printf '%q' "$CACHE_PATH")"
            fi

            rm -f "$FINAL_ARCHIVE"
          fi

          # ──────────────────────────────────────────────
          # POST-EXTRACTION VALIDATION
          # ──────────────────────────────────────────────
          EXTRACTED_COUNT="$(find "$CACHE_PATH" -mindepth 1 -type f 2>/dev/null | wc -l || echo 0)"
          if [ "$EXTRACTED_COUNT" -eq 0 ]; then
            echo "::warning::Extraction completed but no files found in $CACHE_PATH"
            echo "  Contents of cache_path:"
            ls -la "$CACHE_PATH" 2>/dev/null || true
          else
            echo "✅ Restore complete. ~${EXTRACTED_COUNT} file(s) in $CACHE_PATH"
          fi

          echo "::endgroup::"
          break

        done <<< "$SEARCH_LIST"

        if [ "$FOUND" = "false" ]; then
          echo "⚠️ No cache matches found. Proceeding with fresh run."
        fi
